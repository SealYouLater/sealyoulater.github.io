---
layout: default
title: Episodes
description: All episodes of the Off The Tape hockey podcast.
---

<div class="page episodes-page">
  <h1>All episodes</h1>
  <div class="episodes-grid">
    {% for post in site.posts %}
      <a class="episode-card" href="{{ post.url }}">
        <div class="episode-card-image" style="background-image:url({{ post.postHero }})"></div>
        <h2>{{ post.title }}</h2>
        <span class="episode-card-date">{{ post.date | date: '%B %d, %Y' }}</span>
      </a>
    {% endfor %}
  </div>
</div>
